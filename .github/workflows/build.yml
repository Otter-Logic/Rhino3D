name: build

# Build only. Every test boots Rhino through Rhino.Inside, and a hosted runner
# has neither Rhino nor a licence for one, so `dotnet test` here would fail for
# reasons unrelated to the change. Run tests locally; CI guards compilation.
#
# The sibling repos are checked out so the project references resolve. Once
# the dependencies are published on nuget.org, these extra checkouts can go and the
# build will fall through to the pinned packages instead.
#
# Every `path` below has to match the directory name the csproj looks for,
# because the sibling toggles test for a directory rather than asking git what
# was cloned. Get one wrong and that project falls through to a NuGet package
# that does not exist yet, which fails *restore* rather than the build - so it
# reads as a missing package when the real fault is a missing checkout. A repo
# rename that is not mirrored here fails in exactly that misleading way.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: Rhino3D

      - uses: actions/checkout@v4
        with:
          repository: Otter-Logic/Core
          path: Core

      - uses: actions/checkout@v4
        with:
          repository: Otter-Logic/Document
          path: Document

      - uses: actions/checkout@v4
        with:
          repository: Otter-Logic/StructuralForm
          path: StructuralForm

      # The machine learning stack, bottom up: the shared base, then the
      # paradigm repo holding the algorithms, then the toolkit with the opinion.
      - uses: actions/checkout@v4
        with:
          repository: Otter-Logic/MachineLearning
          path: MachineLearning

      - uses: actions/checkout@v4
        with:
          repository: Otter-Logic/Unsupervised
          path: Unsupervised

      - uses: actions/checkout@v4
        with:
          repository: Otter-Logic/StructuralDesign
          path: StructuralDesign

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Rhino3D/OtterLogic.slnx -c Release
